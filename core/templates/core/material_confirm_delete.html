<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Удаление материала — MTR-Control</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;

            background: #f4f6f8;
            color: #1f2937;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
        }

        /* =========================
           НАВИГАЦИЯ
           ========================= */

        .navigation-buttons {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 20px;
        }

        .nav-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;

            padding: 10px 15px;

            border-radius: 9px;

            text-decoration: none;

            font-size: 14px;
            font-weight: 600;

            transition:
                background 0.15s ease,
                color 0.15s ease,
                border-color 0.15s ease,
                transform 0.15s ease,
                box-shadow 0.15s ease;
        }

        .nav-back {
            color: #475569;
            background: #ffffff;

            border: 1px solid #e2e8f0;

            box-shadow:
                0 2px 6px rgba(15, 23, 42, 0.06);
        }

        .nav-back:hover {
            color: #1e293b;
            background: #f8fafc;
            border-color: #cbd5e1;

            transform: translateY(-1px);

            box-shadow:
                0 4px 10px rgba(15, 23, 42, 0.09);
        }

        .nav-home {
            margin-left: auto;

            color: #ffffff;
            background: #2563eb;

            border: 1px solid #2563eb;

            box-shadow:
                0 4px 10px rgba(37, 99, 235, 0.20);
        }

        .nav-home:hover {
            background: #1d4ed8;
            border-color: #1d4ed8;

            transform: translateY(-2px);

            box-shadow:
                0 7px 16px rgba(37, 99, 235, 0.25);
        }

        .home-icon {
            flex-shrink: 0;
        }

        /* =========================
           КАРТОЧКА
           ========================= */

        .card {
            background: white;
            padding: 30px;

            border-radius: 14px;

            box-shadow:
                0 3px 12px rgba(0, 0, 0, 0.05);
        }

        /* =========================
           ЗАГОЛОВОК
           ========================= */

        h1 {
            margin: 0 0 20px 0;

            color: #b91c1c;

            font-size: 26px;
            line-height: 1.3;
        }

        /* =========================
           ПРЕДУПРЕЖДЕНИЕ
           ========================= */

        .warning {
            margin: 0;

            padding: 18px;

            background: #fef2f2;

            border: 1px solid #fecaca;
            border-radius: 10px;

            color: #374151;

            line-height: 1.6;
        }

        .material-name {
            margin-top: 8px;

            color: #111827;

            font-size: 17px;
            font-weight: 700;
        }

        .warning p {
            margin: 12px 0 0;
        }

        /* =========================
           КНОПКИ
           ========================= */

        .buttons {
            display: flex;
            gap: 10px;

            margin-top: 25px;
        }

        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            padding: 10px 16px;

            border-radius: 8px;

            font-size: 14px;
            font-weight: 600;

            text-decoration: none;

            border: none;

            cursor: pointer;

            transition:
                background 0.15s ease,
                color 0.15s ease,
                transform 0.15s ease,
                box-shadow 0.15s ease;
        }

        .button:hover {
            transform: translateY(-1px);
        }

        .button-danger {
            background: #dc2626;
            color: white;

            box-shadow:
                0 3px 8px rgba(220, 38, 38, 0.15);
        }

        .button-danger:hover {
            background: #b91c1c;

            box-shadow:
                0 5px 12px rgba(220, 38, 38, 0.20);
        }

        .button-secondary {
            background: #f1f5f9;
            color: #475569;

            border: 1px solid #e2e8f0;
        }

        .button-secondary:hover {
            background: #e2e8f0;
            color: #1e293b;
        }

        /* =========================
           АДАПТИВНОСТЬ
           ========================= */

        @media (max-width: 700px) {

            body {
                padding: 15px;
            }

            .navigation-buttons {
                align-items: stretch;
            }

            .nav-button {
                flex: 1;
            }

            .card {
                padding: 20px;
            }

            .buttons {
                flex-direction: column;
            }

            .button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <!-- =========================
         НАВИГАЦИЯ
         ========================= -->

    <div class="navigation-buttons">

        <a
            href="{% url 'material_detail' material_id=material.id %}"
            class="nav-button nav-back"
        >
            ← К материалу
        </a>

        <a
            href="{% url 'home' %}"
            class="nav-button nav-home"
        >
            <svg
                class="home-icon"
                width="14"
                height="14"
                viewBox="0 0 24 24"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
                aria-hidden="true"
            >
                <path
                    d="M3 10.5L12 3L21 10.5"
                    stroke="currentColor"
                    stroke-width="2.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                />

                <path
                    d="M5.5 9.5V21H18.5V9.5"
                    stroke="currentColor"
                    stroke-width="2.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                />

                <path
                    d="M9.5 21V14H14.5V21"
                    stroke="currentColor"
                    stroke-width="2.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                />
            </svg>

            <span>Главная</span>
        </a>

    </div>


    <!-- =========================
         ПОДТВЕРЖДЕНИЕ УДАЛЕНИЯ
         ========================= -->

    <div class="card">

        <h1>
            Удалить материал?
        </h1>

        <div class="warning">

            Вы действительно хотите удалить материал:

            <div class="material-name">
                {{ material.name }}
            </div>

            <p>
                Объект:
                <strong>
                    {{ material.project_code.position.object.name }}
                </strong>
            </p>

            <p>
                Это действие нельзя отменить.
            </p>

        </div>


        <form method="post">

            {% csrf_token %}

            <div class="buttons">

                <button
                    type="submit"
                    class="button button-danger"
                >
                    🗑 Да, удалить
                </button>

                <a
                    href="{% url 'material_detail' material_id=material.id %}"
                    class="button button-secondary"
                >
                    Отмена
                </a>

            </div>

        </form>

    </div>

</div>

</body>
</html>
