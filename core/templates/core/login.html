<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Вход — МТР-Контроль</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;

            background: #f4f6f8;

            color: #1f2937;
        }

        .login-card {

            width: 100%;

            max-width: 420px;

            margin: 20px;

            padding: 35px;

            background: white;

            border-radius: 16px;

            border:
                1px solid
                #edf0f3;

            box-shadow:
                0 10px 35px
                rgba(
                    0,
                    0,
                    0,
                    0.08
                );
        }

        .logo {

            width: 52px;

            height: 52px;

            margin-bottom: 18px;

            border-radius: 13px;

            background:
                linear-gradient(
                    135deg,
                    #1e3a8a,
                    #2563eb
                );

            color: white;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 23px;

            font-weight: 700;
        }

        h1 {

            margin: 0 0 7px;

            font-size: 24px;
        }

        .subtitle {

            margin-bottom: 28px;

            color: #94a3b8;

            font-size: 13px;
        }

        .field {

            margin-bottom: 18px;
        }

        label {

            display: block;

            margin-bottom: 7px;

            font-size: 13px;

            font-weight: 600;

            color: #475569;
        }

        input {

            width: 100%;

            height: 46px;

            padding: 0 13px;

            border:
                1px solid
                #dbe1e8;

            border-radius: 9px;

            font-size: 14px;

            outline: none;

            transition:
                border-color 0.18s,
                box-shadow 0.18s;
        }

        input:focus {

            border-color: #2563eb;

            box-shadow:
                0 0 0 3px
                rgba(
                    37,
                    99,
                    235,
                    0.10
                );
        }

        .error {

            margin-bottom: 18px;

            padding: 11px 13px;

            border-radius: 9px;

            background: #fef2f2;

            color: #b91c1c;

            font-size: 13px;
        }

        button {

            width: 100%;

            height: 46px;

            border: none;

            border-radius: 9px;

            background: #2563eb;

            color: white;

            font-size: 14px;

            font-weight: 600;

            cursor: pointer;

            transition:
                background 0.18s;
        }

        button:hover {

            background: #1d4ed8;
        }

    </style>

</head>

<body>

    <div class="login-card">

        <div class="logo">
            М
        </div>

        <h1>
            МТР-Контроль
        </h1>

        <div class="subtitle">
            Вход в систему
        </div>

        {% if form.errors %}

            <div class="error">
                Неверный логин или пароль.
            </div>

        {% endif %}

        <form method="post">

            {% csrf_token %}

            <div class="field">

                <label for="id_username">
                    Логин
                </label>

                <input
                    type="text"
                    name="username"
                    id="id_username"
                    autocomplete="username"
                    required
                    autofocus
                >

            </div>

            <div class="field">

                <label for="id_password">
                    Пароль
                </label>

                <input
                    type="password"
                    name="password"
                    id="id_password"
                    autocomplete="current-password"
                    required
                >

            </div>

            <button type="submit">
                Войти
            </button>

        </form>

    </div>

</body>

</html>
