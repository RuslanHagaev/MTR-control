<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Доступ запрещён — МТР-Контроль</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;

            background: #f4f6f8;

            color: #1f2937;
        }

        .card {

            width: 100%;

            max-width: 500px;

            margin: 20px;

            padding: 45px 35px;

            text-align: center;

            background: white;

            border-radius: 16px;

            border:
                1px solid
                #edf0f3;

            box-shadow:
                0 10px 35px
                rgba(
                    0,
                    0,
                    0,
                    0.08
                );
        }

        .icon {

            width: 64px;

            height: 64px;

            margin:
                0 auto 20px;

            border-radius: 16px;

            background: #fef2f2;

            color: #dc2626;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 28px;

            font-weight: 700;
        }

        h1 {

            margin: 0 0 10px;

            font-size: 24px;
        }

        p {

            margin: 0 0 25px;

            color: #64748b;

            line-height: 1.6;

            font-size: 14px;
        }

        .button {

            display: inline-block;

            padding:
                11px 20px;

            border-radius: 9px;

            background: #2563eb;

            color: white;

            text-decoration: none;

            font-size: 14px;

            font-weight: 600;

            transition:
                background 0.18s;
        }

        .button:hover {

            background: #1d4ed8;
        }

    </style>

</head>

<body>

    <div class="card">

        <div class="icon">
            !
        </div>

        <h1>
            Доступ запрещён
        </h1>

        <p>
            У вас нет прав для просмотра
            этого объекта.
        </p>

        <a
            href="{% url 'home' %}"
            class="button"
        >
            Вернуться на главную
        </a>

    </div>

</body>

</html>
