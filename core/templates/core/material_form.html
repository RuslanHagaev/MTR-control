<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% if form.instance.pk %}
            Редактировать материал
        {% else %}
            Добавить материал
        {% endif %}
        — MTR-Control
    </title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px;

            font-family: Arial, sans-serif;

            background: #f4f6f8;

            color: #222;
        }

        .container {
            max-width: 800px;

            margin: 0 auto;
        }

        .card {
            background: white;

            padding: 30px;

            border-radius: 12px;

            box-shadow:
                0 4px 15px rgba(0, 0, 0, 0.07);
        }

        h1 {
            margin: 0 0 10px 0;
        }

        .location {
            margin-bottom: 25px;

            padding: 15px;

            background: #f8fafc;

            border: 1px solid #e5e7eb;

            border-radius: 8px;

            color: #6b7280;
        }

        .location strong {
            color: #222;
        }

        .location-row {
            margin-bottom: 5px;
        }

        .location-row:last-child {
            margin-bottom: 0;
        }

        form p {
            margin: 0 0 18px 0;
        }

        label {
            display: block;

            margin-bottom: 6px;

            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;

            padding: 10px;

            border: 1px solid #d1d5db;

            border-radius: 6px;

            font-size: 15px;

            background: white;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;

            border-color: #2563eb;

            box-shadow:
                0 0 0 2px rgba(37, 99, 235, 0.1);
        }

        textarea {
            min-height: 100px;

            resize: vertical;
        }

        .errorlist {
            color: #dc2626;

            margin: 5px 0;

            padding-left: 20px;

            font-size: 14px;
        }

        .helptext {
            display: block;

            margin-top: 5px;

            color: #6b7280;

            font-size: 13px;
        }

        .buttons {
            display: flex;

            gap: 10px;

            margin-top: 25px;
        }

        button,
        .back {
            padding: 10px 18px;

            border-radius: 7px;

            border: none;

            font-size: 15px;

            cursor: pointer;

            text-decoration: none;

            display: inline-block;
        }

        button {
            background: #2563eb;

            color: white;
        }

        button:hover {
            background: #1d4ed8;
        }

        .back {
            background: #e5e7eb;

            color: #222;
        }

        .back:hover {
            background: #d1d5db;
        }

    </style>

</head>


<body>

<div class="container">

    <div class="card">

        <h1>

            {% if form.instance.pk %}

                Редактировать материал

            {% else %}

                Добавить материал

            {% endif %}

        </h1>


        <div class="location">

            <div class="location-row">

                <strong>Объект:</strong>

                {{ project_code.position.object.name }}

            </div>


            <div class="location-row">

                <strong>Позиция:</strong>

                {{ project_code.position.name }}

            </div>


            <div class="location-row">

                <strong>Шифр:</strong>

                {{ project_code.code }}

            </div>

        </div>


        <form
            method="post"
            enctype="multipart/form-data"
        >

            {% csrf_token %}


            {{ form.as_p }}


            <div class="buttons">

                <button type="submit">

                    Сохранить

                </button>


                <a
                    href="{% url 'project_code_detail' project_code_id=project_code.id %}"
                    class="back"
                >

                    Отмена

                </a>

            </div>

        </form>

    </div>

</div>

</body>

</html>
